# Timeout in seconds that Limine will use before automatically booting.
timeout: 0

# The entry name that will be displayed in the boot menu.
/Windose
    # We use the Limine boot protocol.
    protocol: limine

    # Match the primary display so QEMU fullscreen does not rescale bitmap text.
    resolution: 1280x800x32

    # Must match WindoseInstaller ESP layout: Windose.elf at the ESP root.
    # boot(): is the partition that contains this limine.conf.
    path: boot():/boot/Windose.elf
